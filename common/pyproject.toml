[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitkeeper-common"
version = "0.1.0"
description = "Shared persistence layer for UnitKeeper services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
