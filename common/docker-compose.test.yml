services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unitkeeper
      POSTGRES_PASSWORD: unitkeeper
      POSTGRES_DB: unitkeeper_common_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitkeeper -d unitkeeper_common_test"]
      interval: 2s
      timeout: 3s
      retries: 15
