name: unitkeeper

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://unitkeeper:unitkeeper@db:5432/unitkeeper}
  APP_ENV: ${APP_ENV:-production}
  SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-with-bot-token}
  TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-86400}
  SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-random-characters}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
  INTERNAL_BOT_SECRET: ${INTERNAL_BOT_SECRET:-replace-with-another-random-secret}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unitkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unitkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-unitkeeper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./common
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://unitkeeper:unitkeeper@db:5432/unitkeeper}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "unitkeeper_backend.entrypoints.scheduler"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    environment:
      UNITKEEPER_BOT_TOKEN: ${UNITKEEPER_BOT_TOKEN:-replace-with-bot-token}
      UNITKEEPER_BACKEND_BASE_URL: http://backend:8000/api/v1
      UNITKEEPER_INTERNAL_BOT_SECRET: ${INTERNAL_BOT_SECRET:-replace-with-another-random-secret}
      UNITKEEPER_MINIAPP_URL: ${UNITKEEPER_MINIAPP_URL:-https://unitkeeper.example.com}
      UNITKEEPER_REQUEST_TIMEOUT_SECONDS: ${UNITKEEPER_REQUEST_TIMEOUT_SECONDS:-10}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
